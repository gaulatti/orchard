name: Windows glyph runtime inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glyph-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: x64, expected: X64}
          - {os: windows-11-arm, platform: ARM64, expected: Arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the isolated physical CI desktop
        shell: pwsh
        run: ./scripts/Set-CiDisplayMode.ps1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish the exact diagnostic catalog
        shell: pwsh
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=${{ matrix.platform }} -o artifacts/catalog
      - name: Inspect the pinned rendering runtime and native debugger tools
        shell: pwsh
        run: ./scripts/Inspect-GlyphRuntime.ps1 -ExpectedArchitecture '${{ matrix.expected }}' -Output artifacts/glyph-runtime
      - name: Retain bounded diagnostic JSON and cropped PNGs in logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/glyph-runtime) {
            $root = (Resolve-Path artifacts/glyph-runtime).Path
            Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -eq '.json' } | Sort-Object FullName | ForEach-Object {
              if ($_.Length -gt 524288) { throw 'Diagnostic file exceeds the bounded log evidence limit.' }
              $bytes = [IO.File]::ReadAllBytes($_.FullName)
              $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
              $name = [IO.Path]::GetRelativePath($root,$_.FullName).Replace('\','/')
              $entry = [ordered]@{ name=$name; bytes=$bytes.Length; sha256=$sha; base64=[Convert]::ToBase64String($bytes) }
              Write-Host ('GLYPHRUNTIME_FILE ' + ($entry | ConvertTo-Json -Compress))
            }
          }
