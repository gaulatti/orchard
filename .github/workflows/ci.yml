name: Windows validation
on:
  # Push runs are temporarily paused during the parity implementation work.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify token generation
        run: node scripts/generate-tokens.mjs --check
      - name: Build the Visual Studio solution
        run: dotnet build Orchard.sln -c Release -p:Platform=x64
      - name: Test token and resource contracts
        run: dotnet test tests/Orchard.Tests/Orchard.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Publish unpackaged catalog
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=x64 --no-restore -o artifacts/catalog
      - name: Verify application resource packaging
        run: |
          dotnet msbuild samples/Orchard.Catalog/Orchard.Catalog.csproj -target:Build -p:Configuration=Release -p:Platform=x64 -getProperty:OutputType,AppxGeneratePriEnabled,ProjectPriFileName,PriInitialPath,ProjectPriFullPath,_SupportXbfAsEmbedFileResources
          Get-ChildItem artifacts/catalog -Filter *.pri | Select-Object Name,Length | Format-Table | Out-String | Write-Host
          if (-not (Test-Path artifacts/catalog/resources.pri)) {
            throw 'Published catalog is missing its application resource index.'
          }
      - name: Verify Bauhaus blend and motion boundaries
        id: bauhaus_smoke
        run: ./scripts/smoke-catalog.ps1 -Component bauhaus -Output artifacts/bauhaus -ExpectedArchitecture X64
      - name: Verify native Input publication boundary
        id: input_smoke
        if: ${{ !cancelled() && (steps.bauhaus_smoke.outcome == 'success' || steps.bauhaus_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component input -Output artifacts/input -ExpectedArchitecture X64
      - name: Verify Activity Item content and native input
        id: activity_smoke
        if: ${{ !cancelled() && (steps.input_smoke.outcome == 'success' || steps.input_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component activity -Output artifacts/activity -ExpectedArchitecture X64
      - name: Verify Attention Surface layout and native actions
        id: attention_smoke
        if: ${{ !cancelled() && (steps.activity_smoke.outcome == 'success' || steps.activity_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component attention -Output artifacts/attention -ExpectedArchitecture X64
      - name: Verify notification owner themes and native popup
        id: notifications_smoke
        if: ${{ !cancelled() && (steps.attention_smoke.outcome == 'success' || steps.attention_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component notifications -Output artifacts/notifications -ExpectedArchitecture X64
      - name: Verify chart theme resources and composed palette
        id: chart_theme_smoke
        if: ${{ !cancelled() && (steps.notifications_smoke.outcome == 'success' || steps.notifications_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component chart-theme -Output artifacts/chart-theme -ExpectedArchitecture X64
      - name: Verify native Line Chart source cases and consumer updates
        id: line_chart_smoke
        if: ${{ !cancelled() && (steps.chart_theme_smoke.outcome == 'success' || steps.chart_theme_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component line-chart -Output artifacts/line-chart -ExpectedArchitecture X64
      - name: Verify Error State content and native retry
        id: error_state_smoke
        if: ${{ !cancelled() && (steps.line_chart_smoke.outcome == 'success' || steps.line_chart_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state -Output artifacts/error-state -ExpectedArchitecture X64
      - name: Verify Error State live Windows contrast
        id: error_state_contrast
        if: ${{ !cancelled() && (steps.error_state_smoke.outcome == 'success' || steps.error_state_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state-contrast -Output artifacts/error-state-contrast -ExpectedArchitecture X64
      - name: Verify native retry after Line Chart keyboard input
        id: error_state_after_chart
        if: ${{ !cancelled() && (steps.error_state_contrast.outcome == 'success' || steps.error_state_contrast.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state-after-chart -Output artifacts/error-state-after-chart -ExpectedArchitecture X64
      - name: Verify Page Header viewport, content and native Back
        id: page_header_smoke
        if: ${{ !cancelled() && (steps.error_state_after_chart.outcome == 'success' || steps.error_state_after_chart.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component page-header -Output artifacts/page-header -ExpectedArchitecture X64
      - name: Verify Section Header content and heading semantics
        id: section_header_smoke
        if: ${{ !cancelled() && (steps.page_header_smoke.outcome == 'success' || steps.page_header_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component section-header -Output artifacts/section-header -ExpectedArchitecture X64
      - name: Verify Dashboard Section responsive layout and child input
        if: ${{ !cancelled() && (steps.section_header_smoke.outcome == 'success' || steps.section_header_smoke.outcome == 'failure') }}
        id: dashboard_section_smoke
        run: ./scripts/smoke-catalog.ps1 -Component dashboard-section -Output artifacts/dashboard-section -ExpectedArchitecture X64
      - name: Verify Dashboard Grid breakpoints, spans and child input
        if: ${{ !cancelled() && (steps.dashboard_section_smoke.outcome == 'success' || steps.dashboard_section_smoke.outcome == 'failure') }}
        id: dashboard_grid_smoke
        run: ./scripts/smoke-catalog.ps1 -Component dashboard-grid -Output artifacts/dashboard-grid -ExpectedArchitecture X64
      - name: Verify Sparkline geometry, raw inspection and lifecycle
        if: ${{ !cancelled() && (steps.dashboard_grid_smoke.outcome == 'success' || steps.dashboard_grid_smoke.outcome == 'failure') }}
        id: sparkline_smoke
        run: ./scripts/smoke-catalog.ps1 -Component sparkline -Output artifacts/sparkline -ExpectedArchitecture X64
      - name: Verify Stat Card layout and consumer composition
        if: ${{ !cancelled() && (steps.sparkline_smoke.outcome == 'success' || steps.sparkline_smoke.outcome == 'failure') }}
        id: stat_card_smoke
        run: ./scripts/smoke-catalog.ps1 -Component stat-card -Output artifacts/stat-card -ExpectedArchitecture X64
      - name: Verify Metric formatting and consumer content
        if: ${{ !cancelled() && (steps.stat_card_smoke.outcome == 'success' || steps.stat_card_smoke.outcome == 'failure') }}
        id: metric_smoke
        run: |
          ./scripts/smoke-catalog.ps1 -Component metric -Output artifacts/metric -ExpectedArchitecture X64
          node scripts/verify-metric.mjs --native artifacts/metric --output artifacts/metric/audit.json
      - name: Verify rapid native Pagination key pairs
        if: ${{ !cancelled() && (steps.metric_smoke.outcome == 'success' || steps.metric_smoke.outcome == 'failure') }}
        id: pagination_paired_smoke
        run: ./scripts/smoke-catalog.ps1 -Component data-table-pagination-paired -ClientSize 1000,745 -Output artifacts/pagination-paired -ExpectedArchitecture X64
      - name: Verify native Stepper source states and input ownership
        if: ${{ !cancelled() && (steps.pagination_paired_smoke.outcome == 'success' || steps.pagination_paired_smoke.outcome == 'failure') }}
        id: stepper_smoke
        run: |
          ./scripts/smoke-catalog.ps1 -Component stepper -Output artifacts/stepper -ExpectedArchitecture X64
          node scripts/verify-stepper-typography.mjs --native artifacts/stepper --output artifacts/stepper/typography-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Stepper baseline regression failed.' }
      - name: Verify Stepper enabled and reduced Windows motion
        if: ${{ !cancelled() && (steps.stepper_smoke.outcome == 'success' || steps.stepper_smoke.outcome == 'failure') }}
        id: stepper_motion_smoke
        run: ./scripts/smoke-stepper-motion.ps1 -Output artifacts/stepper-motion -ExpectedArchitecture X64
      - name: Verify Radio Group enabled and reduced Windows motion
        if: ${{ !cancelled() && (steps.stepper_motion_smoke.outcome == 'success' || steps.stepper_motion_smoke.outcome == 'failure') }}
        id: radio_motion_smoke
        run: |
          ./scripts/smoke-radio-motion.ps1 -Output artifacts/radio-motion -ExpectedArchitecture X64
          node scripts/verify-radio-motion.mjs --native artifacts/radio-motion --output artifacts/radio-motion/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Radio Group motion audit failed.' }
          node scripts/test-radio-motion-audit.mjs --native artifacts/radio-motion
          if ($LASTEXITCODE -ne 0) { throw 'Radio Group motion audit regression failed.' }
          node scripts/verify-radio-continuity.mjs --native artifacts/radio-motion --output artifacts/radio-motion/continuity-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Radio Group continuity audit failed.' }
          node scripts/test-radio-continuity-audit.mjs --native artifacts/radio-motion
          if ($LASTEXITCODE -ne 0) { throw 'Radio Group continuity audit regression failed.' }
      - name: Verify Accordion source layout and native lifecycle
        if: ${{ !cancelled() && (steps.radio_motion_smoke.outcome == 'success' || steps.radio_motion_smoke.outcome == 'failure') }}
        id: accordion_smoke
        run: |
          ./scripts/smoke-accordion.ps1 -Output artifacts/accordion -ExpectedArchitecture X64
          node scripts/verify-accordion-runtime.mjs --native artifacts/accordion --output artifacts/accordion/runtime-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Accordion runtime audit failed.' }
          node scripts/verify-accordion.mjs --native artifacts/accordion/reference --source tests/Reference/Accordion --output artifacts/accordion/layout-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Accordion source layout audit failed.' }
          node scripts/test-accordion-audit.mjs --native artifacts/accordion
          if ($LASTEXITCODE -ne 0) { throw 'Accordion audit regression failed.' }
          node scripts/verify-accordion-motion.mjs --native artifacts/accordion/motion --output artifacts/accordion/motion-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Accordion motion audit failed.' }
          node scripts/test-accordion-motion-audit.mjs --native artifacts/accordion/motion
          if ($LASTEXITCODE -ne 0) { throw 'Accordion motion audit regression failed.' }
          node scripts/verify-accordion-continuity.mjs --native artifacts/accordion/continuity --output artifacts/accordion/continuity-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Accordion continuity audit failed.' }
          node scripts/test-accordion-continuity-audit.mjs --native artifacts/accordion/continuity
          if ($LASTEXITCODE -ne 0) { throw 'Accordion continuity audit regression failed.' }
          node scripts/verify-accordion-scalars.mjs --native artifacts/accordion/scalars --source tests/Reference/AccordionScalars --output artifacts/accordion/scalars-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Accordion scalar audit failed.' }
          node scripts/test-accordion-scalars-audit.mjs --native artifacts/accordion/scalars --source tests/Reference/AccordionScalars
          if ($LASTEXITCODE -ne 0) { throw 'Accordion scalar audit regression failed.' }
      - name: Verify IconBadge source and native content lifecycle
        if: ${{ !cancelled() && (steps.radio_motion_smoke.outcome == 'success' || steps.radio_motion_smoke.outcome == 'failure') }}
        run: |
          ./scripts/smoke-catalog.ps1 -Component icon-badge -ClientSize 320,240 -Output artifacts/icon-badge -ExpectedArchitecture X64
          node scripts/verify-icon-badge.mjs --native artifacts/icon-badge --source tests/Reference/IconBadge --output artifacts/icon-badge/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'IconBadge source audit failed.' }
          node scripts/test-icon-badge-audit.mjs --native artifacts/icon-badge --source tests/Reference/IconBadge --output artifacts/icon-badge-negative
          if ($LASTEXITCODE -ne 0) { throw 'IconBadge audit regression failed.' }
      - name: Verify Empty source and native content lifecycle
        if: ${{ !cancelled() && (steps.radio_motion_smoke.outcome == 'success' || steps.radio_motion_smoke.outcome == 'failure') }}
        run: |
          ./scripts/smoke-catalog.ps1 -Component empty -ClientSize 640,640 -Output artifacts/empty -ExpectedArchitecture X64
          node scripts/verify-empty.mjs --native artifacts/empty --source tests/Reference/Empty --output artifacts/empty/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Empty source audit failed.' }
          node scripts/test-empty-audit.mjs --native artifacts/empty --source tests/Reference/Empty --output artifacts/empty-negative
          if ($LASTEXITCODE -ne 0) { throw 'Empty audit regression failed.' }
      - name: Verify DataList source and viewport boundaries
        if: ${{ !cancelled() && (steps.radio_motion_smoke.outcome == 'success' || steps.radio_motion_smoke.outcome == 'failure') }}
        id: data_list_smoke
        run: |
          foreach ($width in @(1024,639,640)) {
            ./scripts/smoke-catalog.ps1 -Component data-list -ClientSize $width,900 -Output "artifacts/data-list-$width" -ExpectedArchitecture X64
            node scripts/verify-data-list-typography.mjs --native "artifacts/data-list-$width" --viewport $width --output "artifacts/data-list-$width/typography-audit.json"
            if ($LASTEXITCODE -ne 0) { throw 'DataList baseline regression failed.' }
          }
      - name: Verify Timeline source, viewport boundaries and consumer icons
        if: ${{ !cancelled() && (steps.data_list_smoke.outcome == 'success' || steps.data_list_smoke.outcome == 'failure') }}
        id: timeline_smoke
        run: |
          foreach ($width in @(1024,639,640)) {
            ./scripts/smoke-catalog.ps1 -Component timeline -ClientSize $width,900 -Output "artifacts/timeline-$width" -ExpectedArchitecture X64
            node scripts/verify-timeline.mjs --native "artifacts/timeline-$width" --viewport $width --output "artifacts/timeline-$width/audit.json"
            if ($LASTEXITCODE -ne 0) { throw 'Timeline runtime/viewport audit failed.' }
          }
          node scripts/test-timeline-audit.mjs --native artifacts/timeline-1024 --viewport 1024 --output artifacts/timeline-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Timeline negative audit failed.' }
      - name: Verify SearchInput editing, clear ownership and external UIA
        run: |
          foreach ($width in @(320,640)) {
            ./scripts/smoke-catalog.ps1 -Component search-input -ClientSize $width,480 -Output "artifacts/search-input-$width" -ExpectedArchitecture X64
            node scripts/verify-search-input.mjs --native "artifacts/search-input-$width" --width $width --output "artifacts/search-input-$width/audit.json"
            if ($LASTEXITCODE -ne 0) { throw 'SearchInput source/native audit failed.' }
            ./scripts/smoke-catalog.ps1 -Component search-input-states -ClientSize $width,480 -Output "artifacts/search-input-states-$width" -ExpectedArchitecture X64
            node scripts/verify-search-input-states.mjs --native "artifacts/search-input-states-$width" --width $width --output "artifacts/search-input-states-$width/audit.json"
            if ($LASTEXITCODE -ne 0) { throw 'SearchInput state audit failed.' }
          }
          node scripts/test-search-input-audit.mjs --native artifacts/search-input-640 --width 640 --output artifacts/search-input-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'SearchInput negative audit failed.' }
          node scripts/test-search-input-states-audit.mjs --native artifacts/search-input-states-640 --width 640 --output artifacts/search-input-states-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'SearchInput state negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component search-input-catalog -Output artifacts/search-input-catalog -ExpectedArchitecture X64
      - name: Verify FilterChip geometry, native actions and lifecycle
        run: |
          foreach ($width in @(320,640)) {
            ./scripts/smoke-catalog.ps1 -Component filter-chip -ClientSize $width,480 -Output "artifacts/filter-chip-$width" -ExpectedArchitecture X64
            node scripts/verify-filter-chip.mjs --native "artifacts/filter-chip-$width" --width $width --output "artifacts/filter-chip-$width/audit.json"
            if ($LASTEXITCODE -ne 0) { throw 'FilterChip source/native audit failed.' }
          }
          node scripts/test-filter-chip-audit.mjs --native artifacts/filter-chip-640 --width 640 --output artifacts/filter-chip-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component filter-chip-typography -ClientSize 640,480 -Output artifacts/filter-chip-typography -ExpectedArchitecture X64
          node scripts/verify-filter-chip-typography.mjs --native artifacts/filter-chip-typography --output artifacts/filter-chip-typography/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip live typography audit failed.' }
          node scripts/test-filter-chip-typography-audit.mjs --native artifacts/filter-chip-typography --output artifacts/filter-chip-typography-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip typography negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component filter-chip-accessibility -ClientSize 640,480 -Output artifacts/filter-chip-accessibility -ExpectedArchitecture X64
          node scripts/verify-filter-chip-accessibility.mjs --native artifacts/filter-chip-accessibility --output artifacts/filter-chip-accessibility/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip external accessibility audit failed.' }
          node scripts/test-filter-chip-accessibility-audit.mjs --native artifacts/filter-chip-accessibility --output artifacts/filter-chip-accessibility-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip accessibility negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component filter-chip-accessibility-session -ClientSize 640,480 -Output artifacts/filter-chip-accessibility-session -ExpectedArchitecture X64
          node scripts/verify-filter-chip-accessibility-session.mjs --native artifacts/filter-chip-accessibility-session --output artifacts/filter-chip-accessibility-session/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip persistent accessibility audit failed.' }
          node scripts/test-filter-chip-accessibility-session-audit.mjs --native artifacts/filter-chip-accessibility-session --output artifacts/filter-chip-accessibility-session-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'FilterChip persistent accessibility negative audit failed.' }
      - name: Verify Loading Overlay viewport and native focus behavior
        if: ${{ !cancelled() && (steps.timeline_smoke.outcome == 'success' || steps.timeline_smoke.outcome == 'failure') }}
        id: loading_overlay_smoke
        run: |
          foreach ($size in @(@(1024,900),@(640,480),@(320,240))) {
            $width = $size[0]; $height = $size[1]
            ./scripts/smoke-catalog.ps1 -Component loading-overlay -ClientSize $width,$height -Output "artifacts/loading-overlay-$width" -ExpectedArchitecture X64
            node scripts/verify-loading-overlay.mjs --native "artifacts/loading-overlay-$width" --output "artifacts/loading-overlay-$width/audit.json"
            if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay source/input audit failed.' }
          }
          node scripts/test-loading-overlay-audit.mjs --native artifacts/loading-overlay-640 --output artifacts/loading-overlay-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-lifecycle -ClientSize 640,480 -Output artifacts/loading-overlay-lifecycle -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-lifecycle.mjs --native artifacts/loading-overlay-lifecycle --output artifacts/loading-overlay-lifecycle/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay live lifecycle audit failed.' }
          node scripts/test-loading-overlay-lifecycle-audit.mjs --native artifacts/loading-overlay-lifecycle --output artifacts/loading-overlay-lifecycle-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay lifecycle negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-scroll -ClientSize 640,480 -Output artifacts/loading-overlay-scroll -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-scroll.mjs --native artifacts/loading-overlay-scroll --output artifacts/loading-overlay-scroll/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay scroll/transform audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-accessibility -ClientSize 640,480 -Output artifacts/loading-overlay-accessibility -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-accessibility.mjs --native artifacts/loading-overlay-accessibility --output artifacts/loading-overlay-accessibility/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay accessibility audit failed.' }
          node scripts/test-loading-overlay-accessibility-audit.mjs --native artifacts/loading-overlay-accessibility --output artifacts/loading-overlay-accessibility-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay accessibility negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-template -ClientSize 640,480 -Output artifacts/loading-overlay-template -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-template.mjs --native artifacts/loading-overlay-template --output artifacts/loading-overlay-template/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay custom-template audit failed.' }
          node scripts/test-loading-overlay-template-audit.mjs --native artifacts/loading-overlay-template --output artifacts/loading-overlay-template-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay custom-template negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-windows -ClientSize 640,480 -Output artifacts/loading-overlay-windows -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-windows.mjs --native artifacts/loading-overlay-windows --output artifacts/loading-overlay-windows/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay two-window audit failed.' }
          node scripts/test-loading-overlay-windows-audit.mjs --native artifacts/loading-overlay-windows --output artifacts/loading-overlay-windows-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay two-window negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-contrast-entry -ClientSize 640,480 -Output artifacts/loading-overlay-contrast-entry -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-contrast.mjs --native artifacts/loading-overlay-contrast-entry --output artifacts/loading-overlay-contrast-entry/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay contrast-entry audit failed.' }
          node scripts/test-loading-overlay-contrast-entry-audit.mjs --native artifacts/loading-overlay-contrast-entry --output artifacts/loading-overlay-contrast-entry-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay contrast-entry negative audit failed.' }
          ./scripts/smoke-catalog.ps1 -Component loading-overlay-contrast -ClientSize 640,480 -Output artifacts/loading-overlay-contrast -ExpectedArchitecture X64
          node scripts/verify-loading-overlay-contrast.mjs --native artifacts/loading-overlay-contrast --output artifacts/loading-overlay-contrast/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Loading Overlay Windows contrast audit failed.' }
      - name: Verify chart focus across native load boundaries
        if: ${{ !cancelled() && (steps.loading_overlay_smoke.outcome == 'success' || steps.loading_overlay_smoke.outcome == 'failure') }}
        id: chart_load_focus
        run: |
          ./scripts/smoke-catalog.ps1 -Component chart-load-focus -Output artifacts/chart-load-focus -ExpectedArchitecture X64
          node scripts/verify-chart-load-focus.mjs --native artifacts/chart-load-focus --output artifacts/chart-load-focus/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Chart load/focus regression failed.' }
      - name: Exercise and render native controls
        if: ${{ !cancelled() && (steps.chart_load_focus.outcome == 'success' || steps.chart_load_focus.outcome == 'failure') }}
        id: native_smoke
        run: ./scripts/smoke-catalog.ps1 -ExpectedArchitecture X64
      - name: Verify PNG persistence and alpha conversion
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: |
          ./scripts/smoke-catalog.ps1 -Component brush-alpha -ClientSize 1024,745 -Output artifacts/capture-persistence -ExpectedArchitecture X64
          node scripts/verify-capture-persistence.mjs --native artifacts/capture-persistence --output artifacts/capture-persistence/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'PNG persistence regression failed.' }
      - name: Verify live Windows contrast transition
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component contrast -Output artifacts/contrast -ExpectedArchitecture X64
      - name: Pack library and verify independent consumption
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: |
          dotnet pack src/Orchard/Orchard.csproj -c Release -p:Platform=x64 --no-restore -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Library pack failed.' }
          ./scripts/verify-package.ps1
          & pwsh -NoProfile -File ./scripts/verify-package-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer cleanup regression failed.' }
      - name: Upload catalog and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-windows-x64
          path: artifacts/
          if-no-files-found: warn

  arm64-build:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build ARM64 solution
        run: dotnet build Orchard.sln -c Release -p:Platform=ARM64
      - name: Pack and build independent ARM64 consumer
        run: |
          dotnet pack src/Orchard/Orchard.csproj -c Release -p:Platform=ARM64 --no-restore -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Library pack failed.' }
          ./scripts/verify-package.ps1 -Platform ARM64 -BuildOnly -Output artifacts/package-consumer-arm64
          & pwsh -NoProfile -File ./scripts/verify-package-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer cleanup regression failed.' }
      - name: Upload ARM64 build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-windows-arm64-build
          path: artifacts/
          if-no-files-found: warn

  arm64-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify native ARM64 host
        run: |
          $hostArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($hostArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "ARM64 runtime verification requires an ARM64 OS; found $hostArchitecture."
          }
          dotnet --info
      - name: Build ARM64 solution
        run: dotnet build Orchard.sln -c Release -p:Platform=ARM64
      - name: Test token and resource contracts
        run: dotnet test tests/Orchard.Tests/Orchard.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Publish ARM64 catalog
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=ARM64 --no-restore -o artifacts/catalog
      - name: Verify application resource packaging
        run: |
          if (-not (Test-Path artifacts/catalog/resources.pri)) {
            throw 'Published ARM64 catalog is missing its application resource index.'
          }
      - name: Verify native ARM64 Bauhaus blend and motion boundaries
        id: bauhaus_smoke
        run: ./scripts/smoke-catalog.ps1 -Component bauhaus -Output artifacts/bauhaus -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Input publication boundary
        id: input_smoke
        if: ${{ !cancelled() && (steps.bauhaus_smoke.outcome == 'success' || steps.bauhaus_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component input -Output artifacts/input -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Activity Item content and input
        id: activity_smoke
        if: ${{ !cancelled() && (steps.input_smoke.outcome == 'success' || steps.input_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component activity -Output artifacts/activity -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Attention Surface layout and actions
        id: attention_smoke
        if: ${{ !cancelled() && (steps.activity_smoke.outcome == 'success' || steps.activity_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component attention -Output artifacts/attention -ExpectedArchitecture Arm64
      - name: Verify native ARM64 notification owner themes and popup
        id: notifications_smoke
        if: ${{ !cancelled() && (steps.attention_smoke.outcome == 'success' || steps.attention_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component notifications -Output artifacts/notifications -ExpectedArchitecture Arm64
      - name: Verify native ARM64 chart theme resources and palette
        id: chart_theme_smoke
        if: ${{ !cancelled() && (steps.notifications_smoke.outcome == 'success' || steps.notifications_smoke.outcome == 'failure') }}
