name: Orchard CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Verify PR #{0}', github.event.pull_request.number) ||
      inputs.check_author && 'Verify repair author' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'Verify main' ||
      format('PR review ({0})', github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref_name) }}
on:
  push:
    branches: [main, 'policy-install/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to reassess without executing contributor code; empty runs verification
        type: string
        required: false
      check_author:
        description: Inspect existing repair author identity and repository access without writing or deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: orchard-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref }}
  cancel-in-progress: true
jobs:
  resolve-clouseau:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.engine.outputs.sha }}
      digest: ${{ steps.engine.outputs.digest }}
    steps:
      - id: engine
        uses: gaulatti/clouseau/scripts/resolve@fd655851419980f833ff13a94b0d6ff41a901cb2

  unit:
    if: &verify-code >-
      github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_author)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      workflow_tests_passed: ${{ steps.workflow-tests.outputs.workflow_tests_passed }}
    needs: resolve-clouseau
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify token generation
        run: |
          node scripts/generate-tokens.mjs --check
          node scripts/generate-table-palette.mjs --check
          node scripts/generate-data-table-palette.mjs --check
          node scripts/generate-collection-filters-palette.mjs --check
      - name: Set up Python for frozen shared tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen shared test dependencies
        run: python3 -m pip install --disable-pip-version-check -r .clouseau-ci/requirements-test.txt
      - name: Test approval policy
        uses: ./.clouseau-ci
        with:
          operation: test
      - name: Test workflow routing
        id: workflow-tests
        run: |
          test -f .github/tests/routing.test.mjs
          npm ci --prefix .github/tests --ignore-scripts --no-audit --no-fund
          npm test --prefix .github/tests
          echo 'workflow_tests_passed=true' >> "$GITHUB_OUTPUT"

  verify:
    name: >-
      ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_author)) && 'verify' || 'metadata-only' }}
    needs: [unit, build, resolve-clouseau]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - name: Require passing unit and build checks
        if: >-
          always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_author))
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$UNIT_RESULT" = success && test "$BUILD_RESULT" = success
      - name: Enforce 100% line and branch coverage
        if: *verify-code
        run: >-
          echo "::warning::Exact coverage is not enforced: the shared gate has no .NET (Cobertura) coverage format. The policy selects manual merge mode, so the owner merges."
      - name: Require workflow tests execution
        if: *verify-code
        env:
          WORKFLOW_TESTS_PASSED: ${{ needs.unit.outputs.workflow_tests_passed }}
        run: test "$WORKFLOW_TESTS_PASSED" = true

  build:
    if: *verify-code
    timeout-minutes: 35
    runs-on: windows-2025
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify token generation
        run: |
          node scripts/generate-tokens.mjs --check
          node scripts/generate-table-palette.mjs --check
          node scripts/generate-data-table-palette.mjs --check
          node scripts/generate-collection-filters-palette.mjs --check
      - name: Build the Visual Studio solution
        run: dotnet build Orchard.sln -c Release -p:Platform=x64
      - name: Verify frozen menu source evidence
        run: |
          node scripts/reference/verify-menu-source.mjs --reference tests/Reference/Menu.json --frames tests/Reference/Menu --output artifacts/menu-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen menu source audit failed.' }
          node scripts/reference/test-menu-source-audit.mjs --reference tests/Reference/Menu.json --frames tests/Reference/Menu --output artifacts/menu-source-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen menu source rejection audit failed.' }
      - name: Verify frozen Menubar source evidence
        run: |
          node scripts/reference/verify-menubar-source.mjs --reference tests/Reference/Menubar.json --frames tests/Reference/Menubar --output artifacts/menubar-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Menubar source audit failed.' }
          node scripts/reference/test-menubar-source-audit.mjs --reference tests/Reference/Menubar.json --frames tests/Reference/Menubar --output artifacts/menubar-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Menubar source rejection audit failed.' }
      - name: Verify frozen Navigation Menu source evidence
        run: |
          node scripts/reference/verify-navigation-menu-source.mjs --reference tests/Reference/NavigationMenu.json --frames tests/Reference/NavigationMenu --output artifacts/navigation-menu-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Navigation Menu source audit failed.' }
          node scripts/reference/test-navigation-menu-source-audit.mjs --reference tests/Reference/NavigationMenu.json --frames tests/Reference/NavigationMenu --output artifacts/navigation-menu-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Navigation Menu source rejection audit failed.' }
      - name: Verify frozen Sonner source evidence
        run: |
          node scripts/reference/verify-sonner-source.mjs --reference tests/Reference/Sonner.json --frames tests/Reference/Sonner --frozen-only --output artifacts/sonner-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Sonner source audit failed.' }
          node scripts/reference/test-sonner-source-audit.mjs --reference tests/Reference/Sonner.json --frames tests/Reference/Sonner --frozen-only --output artifacts/sonner-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Sonner source rejection audit failed.' }
      - name: Verify frozen Hero Carousel source evidence
        run: |
          node scripts/reference/verify-hero-carousel-source.mjs --reference tests/Reference/HeroCarousel.json --frames tests/Reference/HeroCarousel --frozen-only --output artifacts/hero-carousel-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Hero Carousel source audit failed.' }
          node scripts/reference/test-hero-carousel-source-audit.mjs --reference tests/Reference/HeroCarousel.json --frames tests/Reference/HeroCarousel --frozen-only --output artifacts/hero-carousel-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Hero Carousel source rejection audit failed.' }
      - name: Test token and resource contracts
        run: dotnet test tests/Orchard.Tests/Orchard.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Verify frozen Table source contracts
        run: |
          node scripts/reference/verify-table-source.mjs --reference tests/Reference/Table.json --frames tests/Reference/Table --output artifacts/table-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table source audit failed.' }
          node scripts/reference/test-table-source-audit.mjs --reference tests/Reference/Table.json --frames tests/Reference/Table --output artifacts/table-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Table source rejection audit failed.' }
          node scripts/reference/verify-data-table-source.mjs --reference tests/Reference/DataTable.json --frames tests/Reference/DataTable --output artifacts/data-table-source-audit.json
          node scripts/reference/verify-data-table-filter-plan-source.mjs --reference tests/Reference/DataTableFilterPlan.json --frames tests/Reference/DataTableFilterPlan --output artifacts/data-table-filter-plan-source-audit.json
          node scripts/reference/verify-brand-mark-source.mjs --reference tests/Reference/BrandMark.json --files tests/Reference/BrandMark --output artifacts/brand-mark-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Data Table source audit failed.' }
          node scripts/reference/test-data-table-source-audit.mjs --reference tests/Reference/DataTable.json --frames tests/Reference/DataTable --output artifacts/data-table-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Data Table source rejection audit failed.' }
      - name: Verify frozen Context Menu modal histories
        run: |
          node scripts/reference/verify-context-menu-modal-source.mjs --reference tests/Reference/ContextMenuModal.json --frames tests/Reference/ContextMenuModal --output artifacts/context-menu-modal-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu modal source audit failed.' }
          node scripts/reference/test-context-menu-modal-source-audit.mjs --reference tests/Reference/ContextMenuModal.json --output artifacts/context-menu-modal-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu modal source rejection audit failed.' }
      - name: Verify styled Context Menu portal primitive
        run: |
          ./scripts/verify-context-menu-styled-portal.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/context-menu-styled-portal
          node scripts/test-context-menu-styled-portal-audit.mjs --native artifacts/context-menu-styled-portal --output artifacts/context-menu-styled-portal/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Styled Context Menu portal rejection audit failed.' }
      - name: Verify frozen Context Menu modality histories
        run: |
          node scripts/reference/verify-context-menu-options-source.mjs --reference tests/Reference/ContextMenuOptions.json --frames tests/Reference/ContextMenuOptions --output artifacts/context-menu-options-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu modality source audit failed.' }
          node scripts/reference/test-context-menu-options-source-audit.mjs --reference tests/Reference/ContextMenuOptions.json --output artifacts/context-menu-options-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu modality source rejection audit failed.' }
      - name: Verify frozen Drawer and Sheet source evidence
        run: |
          node scripts/reference/verify-edge-dialog-source.mjs --source tests/Reference/EdgeDialog.json --motion tests/Reference/EdgeDialogMotion.json --presence tests/Reference/EdgeDialogPresence.json --frozen-only --output artifacts/edge-dialog-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Drawer/Sheet source audit failed.' }
          node scripts/reference/test-edge-dialog-source-audit.mjs --source tests/Reference/EdgeDialog.json --motion tests/Reference/EdgeDialogMotion.json --presence tests/Reference/EdgeDialogPresence.json --output artifacts/edge-dialog-source-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Drawer/Sheet source rejection audit failed.' }
          node scripts/reference/verify-edge-interruptions.mjs --reference tests/Reference/EdgeDialogInterruptions.json --frozen-only --output artifacts/edge-interruption-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Drawer/Sheet interruption source audit failed.' }
          node scripts/reference/test-edge-interruption-audit.mjs --reference tests/Reference/EdgeDialogInterruptions.json --output artifacts/edge-interruption-source-negative.json
          if ($LASTEXITCODE -ne 0) { throw 'Drawer/Sheet interruption source rejection audit failed.' }
      - name: Test native Unicode shaping and line breaking without a window
        run: dotnet test tests/Orchard.Text.Tests/Orchard.Text.Tests.csproj -c Release --logger trx --results-directory artifacts/text-tests
      - name: Publish unpackaged catalog
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=x64 --no-restore -o artifacts/catalog
      - name: Verify hidden modal host layout prototype
        run: |
          ./scripts/verify-modal-host-probe.ps1 -AppDirectory artifacts/catalog -Output artifacts/modal-host-core
          node scripts/test-modal-host-probe-audit.mjs --native artifacts/modal-host-core --app artifacts/modal-host-core/app-identity --reference tests/Reference/AlertDialog.json --output artifacts/modal-host-core/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Modal host prototype rejection audit failed.' }
          ./scripts/verify-modal-host-ownership.ps1 -AppDirectory artifacts/catalog -Output artifacts/modal-host-ownership
          node scripts/test-modal-host-ownership-audit.mjs --native artifacts/modal-host-ownership --output artifacts/modal-host-ownership/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Modal host ownership rejection audit failed.' }
      - name: Verify hidden Table primitives and catalog
        run: |
          node scripts/reference/generate-uppercase-data.mjs --unicode-data tests/Reference/UnicodeData-17.0.0.txt --check
          if ($LASTEXITCODE -ne 0) { throw 'Unicode uppercase mappings are stale.' }
          node scripts/reference/verify-table-text-source.mjs --reference tests/Reference/TableText.json --frames tests/Reference/TableText --output artifacts/table-text-source-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table text source audit failed.' }
          ./scripts/verify-table-text.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/table-text
          node scripts/test-table-text-audit.mjs --native artifacts/table-text --reference tests/Reference/TableText.json --output artifacts/table-text/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table text rejection audit failed.' }
          ./scripts/verify-table-customization.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/table-customization
          node scripts/test-table-customization-audit.mjs --native artifacts/table-customization --output artifacts/table-customization/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table customization rejection audit failed.' }
          ./scripts/verify-table-template.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/table-template
          node scripts/test-table-template-audit.mjs --native artifacts/table-template --output artifacts/table-template/negative-audit.json
          ./scripts/verify-brand-mark.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/brand-mark
          node scripts/test-brand-mark-audit.mjs --native artifacts/brand-mark --output artifacts/brand-mark/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Brand Mark rejection audit failed.' }
          ./scripts/verify-menubar.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/menubar
          node scripts/test-menubar-audit.mjs --native artifacts/menubar --output artifacts/menubar/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Menubar rejection audit failed.' }
          ./scripts/verify-navigation-menu.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/navigation-menu
          node scripts/test-navigation-menu-audit.mjs --native artifacts/navigation-menu --output artifacts/navigation-menu/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Navigation Menu rejection audit failed.' }
          ./scripts/verify-sonner.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/sonner
          node scripts/test-sonner-audit.mjs --native artifacts/sonner --host-assembly Orchard.Catalog.dll --output artifacts/sonner/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Sonner rejection audit failed.' }
          ./scripts/verify-hero-carousel.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/hero-carousel
          node scripts/test-hero-carousel-audit.mjs --native artifacts/hero-carousel --host-assembly Orchard.Catalog.dll --output artifacts/hero-carousel/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Hero Carousel rejection audit failed.' }
          if ($LASTEXITCODE -ne 0) { throw 'Table template rejection audit failed.' }
          ./scripts/verify-table-performance.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/table-performance
          node scripts/test-table-performance-audit.mjs --native artifacts/table-performance --output artifacts/table-performance/negative-audit.json
          ./scripts/verify-data-table-performance.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/data-table-performance
          node scripts/test-data-table-performance-audit.mjs --native artifacts/data-table-performance --output artifacts/data-table-performance/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table performance/lifecycle rejection audit failed.' }
          ./scripts/verify-simple-data-table.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/simple-data-table
          node scripts/test-simple-data-table-audit.mjs --native artifacts/simple-data-table --reference tests/Reference/Table.json --output artifacts/simple-data-table/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Simple DataTable rejection audit failed.' }
          ./scripts/verify-data-table.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/data-table
          node scripts/test-data-table-audit.mjs --native artifacts/data-table --output artifacts/data-table/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Data Table native rejection audit failed.' }
          ./scripts/verify-data-table-reference.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/data-table-reference
          node scripts/test-data-table-reference-audit.mjs --native artifacts/data-table-reference --output artifacts/data-table-reference/negative-audit.json
          ./scripts/verify-data-table-filter-plan.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/data-table-filter-plan
          node scripts/test-data-table-filter-plan-audit.mjs --native artifacts/data-table-filter-plan --output artifacts/data-table-filter-plan/negative-audit.json
          node scripts/verify-data-table-paint.mjs --native artifacts/data-table-reference --output artifacts/data-table-reference/paint-audit.json
          node scripts/test-data-table-paint-audit.mjs --native artifacts/data-table-reference --output artifacts/data-table-reference/paint-negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Data Table full reference rejection audit failed.' }
          ./scripts/verify-data-table-catalog.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/data-table-catalog
          node scripts/test-data-table-catalog-audit.mjs --native artifacts/data-table-catalog --output artifacts/data-table-catalog/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Data Table actual catalog rejection audit failed.' }
          ./scripts/verify-data-table-live.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/data-table-live
          node scripts/test-data-table-live-audit.mjs --native artifacts/data-table-live --output artifacts/data-table-live/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Live table producer rejection audit failed.' }
          ./scripts/verify-simple-table-catalog.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/simple-table-catalog
          node scripts/test-simple-table-catalog-audit.mjs --native artifacts/simple-table-catalog --output artifacts/simple-table-catalog/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Simple Table catalog rejection audit failed.' }
          ./scripts/verify-table-primitives.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/table-primitives
          node scripts/test-table-primitives-audit.mjs --native artifacts/table-primitives --reference tests/Reference/Table.json --output artifacts/table-primitives/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table primitive rejection audit failed.' }
          ./scripts/verify-table-catalog.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/table-catalog
          node scripts/test-table-catalog-audit.mjs --native artifacts/table-catalog --output artifacts/table-catalog/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Table catalog rejection audit failed.' }
      - name: Verify hidden Context Menu native foundation
        run: |
          ./scripts/verify-context-menu-options.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/context-menu-options
          node scripts/test-context-menu-options-audit.mjs --native artifacts/context-menu-options --output artifacts/context-menu-options/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu root modality rejection audit failed.' }
          ./scripts/verify-context-menu-modal.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/context-menu-modal
          node scripts/test-context-menu-modal-audit.mjs --native artifacts/context-menu-modal --output artifacts/context-menu-modal/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Public Context Menu modal rejection audit failed.' }
          ./scripts/verify-context-menu-root.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/context-menu-root
          node scripts/test-context-menu-root-audit.mjs --native artifacts/context-menu-root --output artifacts/context-menu-root/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu root rejection audit failed.' }
          ./scripts/verify-context-menu-catalog.ps1 -AppDirectory samples/Orchard.Catalog/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64 -Output artifacts/context-menu-catalog
          node scripts/test-context-menu-catalog-audit.mjs --native artifacts/context-menu-catalog --output artifacts/context-menu-catalog/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Context Menu catalog rejection audit failed.' }
      - name: Verify hidden OTP Input public contracts
        run: |
          ./scripts/verify-otp-input.ps1 -AppDirectory artifacts/catalog -Output artifacts/otp-input
          node scripts/test-otp-input-audit.mjs --native artifacts/otp-input --output artifacts/otp-input/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'OTP Input rejection audit failed.' }
          ./scripts/verify-otp-input.ps1 -AppDirectory artifacts/catalog -Catalog -Output artifacts/otp-input-catalog
          node scripts/test-otp-input-catalog-audit.mjs --native artifacts/otp-input-catalog --output artifacts/otp-input-catalog/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'OTP Input catalog rejection audit failed.' }
      - name: Verify hidden App Tab Bar public contracts
        run: |
          ./scripts/verify-app-tab-bar.ps1 -AppDirectory artifacts/catalog -Output artifacts/app-tab-bar
          node scripts/test-app-tab-bar-audit.mjs --native artifacts/app-tab-bar --output artifacts/app-tab-bar/negative-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'App Tab Bar rejection audit failed.' }
          ./scripts/verify-app-tab-bar.ps1 -AppDirectory artifacts/catalog -Catalog -Output artifacts/app-tab-bar-catalog
          node scripts/test-app-tab-bar-catalog-audit.mjs --native artifacts/app-tab-bar-catalog --output artifacts/app-tab-bar-catalog/negative-audit.json
