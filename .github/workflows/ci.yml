name: Windows null-scheme activation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-null-scheme:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        mode: [activation-null-original-restore]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the isolated physical CI desktop
        shell: pwsh
        run: ./scripts/Set-CiDisplayMode.ps1
      - name: Probe native null-pointer restoration with strict original-state equality
        shell: pwsh
        run: ./scripts/Probe-NativeContrastNullScheme.ps1 -RestoreMode '${{ matrix.mode }}' -Output 'artifacts/null-scheme/result.json'
