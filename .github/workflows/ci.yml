        if: ${{ !cancelled() && (steps.chart_theme_smoke.outcome == 'success' || steps.chart_theme_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component line-chart -Output artifacts/line-chart -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Error State content and retry
        id: error_state_smoke
        if: ${{ !cancelled() && (steps.line_chart_smoke.outcome == 'success' || steps.line_chart_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state -Output artifacts/error-state -ExpectedArchitecture Arm64
      - name: Verify native ARM64 retry after Line Chart keyboard input
        id: error_state_after_chart
