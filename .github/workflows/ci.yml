          node scripts/verify-accordion.mjs --native artifacts/accordion/reference --source tests/Reference/Accordion --output artifacts/accordion/layout-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Accordion source layout audit failed.' }
          node scripts/test-accordion-audit.mjs --native artifacts/accordion
