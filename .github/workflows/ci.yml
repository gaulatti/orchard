name: Windows ink source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ink-source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: x64, expected: X64, mode: foreground-color}
          - {os: windows-11-arm, platform: ARM64, expected: Arm64, mode: foreground-color}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the isolated physical CI desktop
        shell: pwsh
        run: ./scripts/Set-CiDisplayMode.ps1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish the exact diagnostic catalog
        shell: pwsh
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=${{ matrix.platform }} -o artifacts/catalog
      - name: Probe one paint source with the first original raster retained
        shell: pwsh
        run: ./scripts/Probe-InkBrushSources.ps1 -Mode '${{ matrix.mode }}' -ExpectedArchitecture '${{ matrix.expected }}' -Output artifacts/ink-source-probe
      - name: Retain bounded diagnostic JSON and cropped PNGs in logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ink-source-probe) {
            Get-ChildItem artifacts/ink-source-probe -File | Where-Object { $_.Extension -in @('.json','.jsonl') -or $_.Name -like 'ink-probe-*.png' } | Sort-Object Name | ForEach-Object {
              if ($_.Length -gt 524288) { throw 'Diagnostic file exceeds the bounded log evidence limit.' }
              $bytes = [IO.File]::ReadAllBytes($_.FullName)
              $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
              $entry = [ordered]@{ name=$_.Name; bytes=$bytes.Length; sha256=$sha; base64=[Convert]::ToBase64String($bytes) }
              Write-Host ('INKPROBE_FILE ' + ($entry | ConvertTo-Json -Compress))
            }
          }
