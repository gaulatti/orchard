name: Windows validation
on:
  # Push runs are temporarily paused during the parity implementation work.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify token generation
        run: node scripts/generate-tokens.mjs --check
      - name: Build the Visual Studio solution
        run: dotnet build Orchard.sln -c Release -p:Platform=x64
      - name: Test token and resource contracts
        run: dotnet test tests/Orchard.Tests/Orchard.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Publish unpackaged catalog
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=x64 --no-restore -o artifacts/catalog
      - name: Verify application resource packaging
        run: |
          dotnet msbuild samples/Orchard.Catalog/Orchard.Catalog.csproj -target:Build -p:Configuration=Release -p:Platform=x64 -getProperty:OutputType,AppxGeneratePriEnabled,ProjectPriFileName,PriInitialPath,ProjectPriFullPath,_SupportXbfAsEmbedFileResources
          Get-ChildItem artifacts/catalog -Filter *.pri | Select-Object Name,Length | Format-Table | Out-String | Write-Host
          if (-not (Test-Path artifacts/catalog/resources.pri)) {
            throw 'Published catalog is missing its application resource index.'
          }
      - name: Verify Bauhaus blend and motion boundaries
        id: bauhaus_smoke
        run: ./scripts/smoke-catalog.ps1 -Component bauhaus -Output artifacts/bauhaus -ExpectedArchitecture X64
      - name: Verify native Input publication boundary
        id: input_smoke
        if: ${{ !cancelled() && (steps.bauhaus_smoke.outcome == 'success' || steps.bauhaus_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component input -Output artifacts/input -ExpectedArchitecture X64
      - name: Verify Activity Item content and native input
        id: activity_smoke
        if: ${{ !cancelled() && (steps.input_smoke.outcome == 'success' || steps.input_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component activity -Output artifacts/activity -ExpectedArchitecture X64
      - name: Verify Attention Surface layout and native actions
        id: attention_smoke
        if: ${{ !cancelled() && (steps.activity_smoke.outcome == 'success' || steps.activity_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component attention -Output artifacts/attention -ExpectedArchitecture X64
      - name: Verify notification owner themes and native popup
        id: notifications_smoke
        if: ${{ !cancelled() && (steps.attention_smoke.outcome == 'success' || steps.attention_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component notifications -Output artifacts/notifications -ExpectedArchitecture X64
      - name: Verify chart theme resources and composed palette
        id: chart_theme_smoke
        if: ${{ !cancelled() && (steps.notifications_smoke.outcome == 'success' || steps.notifications_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component chart-theme -Output artifacts/chart-theme -ExpectedArchitecture X64
      - name: Verify native Line Chart source cases and consumer updates
        id: line_chart_smoke
        if: ${{ !cancelled() && (steps.chart_theme_smoke.outcome == 'success' || steps.chart_theme_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component line-chart -Output artifacts/line-chart -ExpectedArchitecture X64
      - name: Verify Error State content and native retry
        id: error_state_smoke
        if: ${{ !cancelled() && (steps.line_chart_smoke.outcome == 'success' || steps.line_chart_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state -Output artifacts/error-state -ExpectedArchitecture X64
      - name: Verify Error State live Windows contrast
        id: error_state_contrast
        if: ${{ !cancelled() && (steps.error_state_smoke.outcome == 'success' || steps.error_state_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state-contrast -Output artifacts/error-state-contrast -ExpectedArchitecture X64
      - name: Verify native retry after Line Chart keyboard input
        id: error_state_after_chart
        if: ${{ !cancelled() && (steps.error_state_contrast.outcome == 'success' || steps.error_state_contrast.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state-after-chart -Output artifacts/error-state-after-chart -ExpectedArchitecture X64
      - name: Verify Page Header viewport, content and native Back
        id: page_header_smoke
        if: ${{ !cancelled() && (steps.error_state_after_chart.outcome == 'success' || steps.error_state_after_chart.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component page-header -Output artifacts/page-header -ExpectedArchitecture X64
      - name: Verify Section Header content and heading semantics
        id: section_header_smoke
        if: ${{ !cancelled() && (steps.page_header_smoke.outcome == 'success' || steps.page_header_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component section-header -Output artifacts/section-header -ExpectedArchitecture X64
      - name: Verify Dashboard Section responsive layout and child input
        if: ${{ !cancelled() && (steps.section_header_smoke.outcome == 'success' || steps.section_header_smoke.outcome == 'failure') }}
        id: dashboard_section_smoke
        run: ./scripts/smoke-catalog.ps1 -Component dashboard-section -Output artifacts/dashboard-section -ExpectedArchitecture X64
      - name: Verify Dashboard Grid breakpoints, spans and child input
        if: ${{ !cancelled() && (steps.dashboard_section_smoke.outcome == 'success' || steps.dashboard_section_smoke.outcome == 'failure') }}
        id: dashboard_grid_smoke
        run: ./scripts/smoke-catalog.ps1 -Component dashboard-grid -Output artifacts/dashboard-grid -ExpectedArchitecture X64
      - name: Verify Sparkline geometry, raw inspection and lifecycle
        if: ${{ !cancelled() && (steps.dashboard_grid_smoke.outcome == 'success' || steps.dashboard_grid_smoke.outcome == 'failure') }}
        id: sparkline_smoke
        run: ./scripts/smoke-catalog.ps1 -Component sparkline -Output artifacts/sparkline -ExpectedArchitecture X64
      - name: Verify Stat Card layout and consumer composition
        if: ${{ !cancelled() && (steps.sparkline_smoke.outcome == 'success' || steps.sparkline_smoke.outcome == 'failure') }}
        id: stat_card_smoke
        run: ./scripts/smoke-catalog.ps1 -Component stat-card -Output artifacts/stat-card -ExpectedArchitecture X64
      - name: Verify rapid native Pagination key pairs
        if: ${{ !cancelled() && (steps.stat_card_smoke.outcome == 'success' || steps.stat_card_smoke.outcome == 'failure') }}
        id: pagination_paired_smoke
        run: ./scripts/smoke-catalog.ps1 -Component data-table-pagination-paired -ClientSize 1000,745 -Output artifacts/pagination-paired -ExpectedArchitecture X64
      - name: Verify native Stepper source states and input ownership
        if: ${{ !cancelled() && (steps.pagination_paired_smoke.outcome == 'success' || steps.pagination_paired_smoke.outcome == 'failure') }}
        id: stepper_smoke
        run: |
          ./scripts/smoke-catalog.ps1 -Component stepper -Output artifacts/stepper -ExpectedArchitecture X64
          node scripts/verify-stepper-typography.mjs --native artifacts/stepper --output artifacts/stepper/typography-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Stepper baseline regression failed.' }
      - name: Verify Stepper enabled and reduced Windows motion
        if: ${{ !cancelled() && (steps.stepper_smoke.outcome == 'success' || steps.stepper_smoke.outcome == 'failure') }}
        id: stepper_motion_smoke
        run: ./scripts/smoke-stepper-motion.ps1 -Output artifacts/stepper-motion -ExpectedArchitecture X64
      - name: Verify DataList source and viewport boundaries
        if: ${{ !cancelled() && (steps.stepper_motion_smoke.outcome == 'success' || steps.stepper_motion_smoke.outcome == 'failure') }}
        id: data_list_smoke
        run: |
          foreach ($width in @(1024,639,640)) {
            ./scripts/smoke-catalog.ps1 -Component data-list -ClientSize $width,900 -Output "artifacts/data-list-$width" -ExpectedArchitecture X64
          }
      - name: Verify chart focus across native load boundaries
        if: ${{ !cancelled() && (steps.data_list_smoke.outcome == 'success' || steps.data_list_smoke.outcome == 'failure') }}
        id: chart_load_focus
        run: |
          ./scripts/smoke-catalog.ps1 -Component chart-load-focus -Output artifacts/chart-load-focus -ExpectedArchitecture X64
          node scripts/verify-chart-load-focus.mjs --native artifacts/chart-load-focus --output artifacts/chart-load-focus/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Chart load/focus regression failed.' }
      - name: Exercise and render native controls
        if: ${{ !cancelled() && (steps.chart_load_focus.outcome == 'success' || steps.chart_load_focus.outcome == 'failure') }}
        id: native_smoke
        run: ./scripts/smoke-catalog.ps1 -ExpectedArchitecture X64
      - name: Verify PNG persistence and alpha conversion
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: |
          ./scripts/smoke-catalog.ps1 -Component brush-alpha -ClientSize 1024,745 -Output artifacts/capture-persistence -ExpectedArchitecture X64
          node scripts/verify-capture-persistence.mjs --native artifacts/capture-persistence --output artifacts/capture-persistence/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'PNG persistence regression failed.' }
      - name: Verify live Windows contrast transition
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component contrast -Output artifacts/contrast -ExpectedArchitecture X64
      - name: Pack library and verify independent consumption
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: |
          dotnet pack src/Orchard/Orchard.csproj -c Release -p:Platform=x64 --no-restore -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Library pack failed.' }
          ./scripts/verify-package.ps1
          & pwsh -NoProfile -File ./scripts/verify-package-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer cleanup regression failed.' }
      - name: Upload catalog and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-windows-x64
          path: artifacts/
          if-no-files-found: warn

  arm64-build:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build ARM64 solution
        run: dotnet build Orchard.sln -c Release -p:Platform=ARM64
      - name: Pack and build independent ARM64 consumer
        run: |
          dotnet pack src/Orchard/Orchard.csproj -c Release -p:Platform=ARM64 --no-restore -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Library pack failed.' }
          ./scripts/verify-package.ps1 -Platform ARM64 -BuildOnly -Output artifacts/package-consumer-arm64
          & pwsh -NoProfile -File ./scripts/verify-package-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer cleanup regression failed.' }
      - name: Upload ARM64 build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-windows-arm64-build
          path: artifacts/
          if-no-files-found: warn

  arm64-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify native ARM64 host
        run: |
          $hostArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($hostArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "ARM64 runtime verification requires an ARM64 OS; found $hostArchitecture."
          }
          dotnet --info
      - name: Build ARM64 solution
        run: dotnet build Orchard.sln -c Release -p:Platform=ARM64
      - name: Test token and resource contracts
        run: dotnet test tests/Orchard.Tests/Orchard.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - name: Publish ARM64 catalog
        run: dotnet publish samples/Orchard.Catalog/Orchard.Catalog.csproj -c Release -p:Platform=ARM64 --no-restore -o artifacts/catalog
      - name: Verify application resource packaging
        run: |
          if (-not (Test-Path artifacts/catalog/resources.pri)) {
            throw 'Published ARM64 catalog is missing its application resource index.'
          }
      - name: Verify native ARM64 Bauhaus blend and motion boundaries
        id: bauhaus_smoke
        run: ./scripts/smoke-catalog.ps1 -Component bauhaus -Output artifacts/bauhaus -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Input publication boundary
        id: input_smoke
        if: ${{ !cancelled() && (steps.bauhaus_smoke.outcome == 'success' || steps.bauhaus_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component input -Output artifacts/input -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Activity Item content and input
        id: activity_smoke
        if: ${{ !cancelled() && (steps.input_smoke.outcome == 'success' || steps.input_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component activity -Output artifacts/activity -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Attention Surface layout and actions
        id: attention_smoke
        if: ${{ !cancelled() && (steps.activity_smoke.outcome == 'success' || steps.activity_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component attention -Output artifacts/attention -ExpectedArchitecture Arm64
      - name: Verify native ARM64 notification owner themes and popup
        id: notifications_smoke
        if: ${{ !cancelled() && (steps.attention_smoke.outcome == 'success' || steps.attention_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component notifications -Output artifacts/notifications -ExpectedArchitecture Arm64
      - name: Verify native ARM64 chart theme resources and palette
        id: chart_theme_smoke
        if: ${{ !cancelled() && (steps.notifications_smoke.outcome == 'success' || steps.notifications_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component chart-theme -Output artifacts/chart-theme -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Line Chart source cases and consumer updates
        id: line_chart_smoke
        if: ${{ !cancelled() && (steps.chart_theme_smoke.outcome == 'success' || steps.chart_theme_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component line-chart -Output artifacts/line-chart -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Error State content and retry
        id: error_state_smoke
        if: ${{ !cancelled() && (steps.line_chart_smoke.outcome == 'success' || steps.line_chart_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state -Output artifacts/error-state -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Error State Windows contrast
        id: error_state_contrast
        if: ${{ !cancelled() && (steps.error_state_smoke.outcome == 'success' || steps.error_state_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state-contrast -Output artifacts/error-state-contrast -ExpectedArchitecture Arm64
      - name: Verify native ARM64 retry after Line Chart keyboard input
        id: error_state_after_chart
        if: ${{ !cancelled() && (steps.error_state_contrast.outcome == 'success' || steps.error_state_contrast.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component error-state-after-chart -Output artifacts/error-state-after-chart -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Page Header viewport, content and Back
        id: page_header_smoke
        if: ${{ !cancelled() && (steps.error_state_after_chart.outcome == 'success' || steps.error_state_after_chart.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component page-header -Output artifacts/page-header -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Section Header content and headings
        id: section_header_smoke
        if: ${{ !cancelled() && (steps.page_header_smoke.outcome == 'success' || steps.page_header_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component section-header -Output artifacts/section-header -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Dashboard Section layout and child input
        if: ${{ !cancelled() && (steps.section_header_smoke.outcome == 'success' || steps.section_header_smoke.outcome == 'failure') }}
        id: dashboard_section_smoke
        run: ./scripts/smoke-catalog.ps1 -Component dashboard-section -Output artifacts/dashboard-section -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Dashboard Grid breakpoints and spans
        if: ${{ !cancelled() && (steps.dashboard_section_smoke.outcome == 'success' || steps.dashboard_section_smoke.outcome == 'failure') }}
        id: dashboard_grid_smoke
        run: ./scripts/smoke-catalog.ps1 -Component dashboard-grid -Output artifacts/dashboard-grid -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Sparkline geometry and inspection
        if: ${{ !cancelled() && (steps.dashboard_grid_smoke.outcome == 'success' || steps.dashboard_grid_smoke.outcome == 'failure') }}
        id: sparkline_smoke
        run: ./scripts/smoke-catalog.ps1 -Component sparkline -Output artifacts/sparkline -ExpectedArchitecture Arm64
      - name: Verify Stat Card layout and consumer composition
        if: ${{ !cancelled() && (steps.sparkline_smoke.outcome == 'success' || steps.sparkline_smoke.outcome == 'failure') }}
        id: stat_card_smoke
        run: ./scripts/smoke-catalog.ps1 -Component stat-card -Output artifacts/stat-card -ExpectedArchitecture Arm64
      - name: Verify rapid native ARM64 Pagination key pairs
        if: ${{ !cancelled() && (steps.stat_card_smoke.outcome == 'success' || steps.stat_card_smoke.outcome == 'failure') }}
        id: pagination_paired_smoke
        run: ./scripts/smoke-catalog.ps1 -Component data-table-pagination-paired -ClientSize 1000,745 -Output artifacts/pagination-paired -ExpectedArchitecture Arm64
      - name: Verify native ARM64 Stepper source states and input ownership
        if: ${{ !cancelled() && (steps.pagination_paired_smoke.outcome == 'success' || steps.pagination_paired_smoke.outcome == 'failure') }}
        id: stepper_smoke
        run: |
          ./scripts/smoke-catalog.ps1 -Component stepper -Output artifacts/stepper -ExpectedArchitecture Arm64
          node scripts/verify-stepper-typography.mjs --native artifacts/stepper --output artifacts/stepper/typography-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 Stepper baseline regression failed.' }
      - name: Verify native ARM64 Stepper enabled and reduced Windows motion
        if: ${{ !cancelled() && (steps.stepper_smoke.outcome == 'success' || steps.stepper_smoke.outcome == 'failure') }}
        id: stepper_motion_smoke
        run: ./scripts/smoke-stepper-motion.ps1 -Output artifacts/stepper-motion -ExpectedArchitecture Arm64
      - name: Verify native ARM64 DataList source and viewport boundaries
        if: ${{ !cancelled() && (steps.stepper_motion_smoke.outcome == 'success' || steps.stepper_motion_smoke.outcome == 'failure') }}
        id: data_list_smoke
        run: |
          foreach ($width in @(1024,639,640)) {
            ./scripts/smoke-catalog.ps1 -Component data-list -ClientSize $width,900 -Output "artifacts/data-list-$width" -ExpectedArchitecture Arm64
          }
      - name: Verify native ARM64 chart focus across load boundaries
        if: ${{ !cancelled() && (steps.data_list_smoke.outcome == 'success' || steps.data_list_smoke.outcome == 'failure') }}
        id: chart_load_focus
        run: |
          ./scripts/smoke-catalog.ps1 -Component chart-load-focus -Output artifacts/chart-load-focus -ExpectedArchitecture Arm64
          node scripts/verify-chart-load-focus.mjs --native artifacts/chart-load-focus --output artifacts/chart-load-focus/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 chart load/focus regression failed.' }
      - name: Exercise and render native ARM64 controls
        if: ${{ !cancelled() && (steps.chart_load_focus.outcome == 'success' || steps.chart_load_focus.outcome == 'failure') }}
        id: native_smoke
        run: ./scripts/smoke-catalog.ps1 -ExpectedArchitecture Arm64
      - name: Verify native ARM64 PNG persistence and alpha conversion
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: |
          ./scripts/smoke-catalog.ps1 -Component brush-alpha -ClientSize 1024,745 -Output artifacts/capture-persistence -ExpectedArchitecture Arm64
          node scripts/verify-capture-persistence.mjs --native artifacts/capture-persistence --output artifacts/capture-persistence/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 PNG persistence regression failed.' }
      - name: Verify live Windows contrast transition
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: ./scripts/smoke-catalog.ps1 -Component contrast -Output artifacts/contrast -ExpectedArchitecture Arm64
      - name: Pack library and verify native ARM64 consumption
        if: ${{ !cancelled() && (steps.native_smoke.outcome == 'success' || steps.native_smoke.outcome == 'failure') }}
        run: |
          dotnet pack src/Orchard/Orchard.csproj -c Release -p:Platform=ARM64 --no-restore -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Library pack failed.' }
          ./scripts/verify-package.ps1 -Platform ARM64 -Output artifacts/package-consumer-arm64
          & pwsh -NoProfile -File ./scripts/verify-package-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer cleanup regression failed.' }
      - name: Upload ARM64 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-windows-arm64-runtime
          path: artifacts/
          if-no-files-found: warn
