            ./scripts/smoke-catalog.ps1 -Component search-input-states -ClientSize $width,480 -Output "artifacts/search-input-states-$width" -ExpectedArchitecture Arm64
            node scripts/verify-search-input-states.mjs --native "artifacts/search-input-states-$width" --width $width --output "artifacts/search-input-states-$width/audit.json"
